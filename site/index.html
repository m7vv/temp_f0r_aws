<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Simple Test Page</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			font-family: Arial, sans-serif;
			color: #222;
			background: #f5f7fa;
		}
		header {
			padding: 1rem 2rem;
			color: white;
			background: #2457a6;
		}
		nav ul {
			display: flex;
			gap: 1.5rem;
			margin: 0;
			padding: 0;
			list-style: none;
		}
		nav a { color: white; text-decoration: none; }
		nav a:hover { text-decoration: underline; }
		main {
			flex: 1;
			width: min(800px, 100%);
			margin: 0 auto;
			padding: 3rem 2rem;
		}
		footer {
			padding: 1rem 2rem;
			text-align: center;
			color: #555;
			background: #e5e9ef;
		}
	</style>
</head>
<body>
	<header>
		<nav aria-label="Main menu">
			<ul>
				<li><a href="#home">Home</a></li>
				<li><a href="#about">About</a></li>
				<li><a href="#contact">Contact</a></li>
			</ul>
		</nav>
	</header>
	<main id="home">
		<h1>Welcome</h1>
		<p>This is a simple test page with a main menu, some body text, and a footer.</p>
	</main>
	<footer>© 2025 Simple Test Page</footer>
</body>
</html>
